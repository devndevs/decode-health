name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: decode
          POSTGRES_PASSWORD: decode
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U decode"
          --health-interval 5s
          --health-retries 10
    env:
      # Enables the end-to-end ingest → database → estimate test.
      TEST_DATABASE_URL: postgres://decode:decode@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm ingest registry:check
      - run: pnpm test
      - run: pnpm build
